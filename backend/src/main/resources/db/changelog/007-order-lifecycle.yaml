databaseChangeLog:
  - changeSet:
      id: 007-order-actual-check-in
      author: sweet-home
      changes:
        - addColumn:
            tableName: rental_order
            columns:
              - column: { name: actual_check_in_at, type: DATETIME }
  - changeSet:
      id: 007-order-actual-check-out
      author: sweet-home
      changes:
        - addColumn:
            tableName: rental_order
            columns:
              - column: { name: actual_check_out_at, type: DATETIME }
  - changeSet:
      id: 007-room-needs-cleaning
      author: sweet-home
      changes:
        - addColumn:
            tableName: room
            columns:
              - column: { name: needs_cleaning, type: BIT, defaultValueBoolean: false, constraints: { nullable: false } }
  - changeSet:
      id: 007-order-cancel
      author: sweet-home
      changes:
        - addColumn:
            tableName: rental_order
            columns:
              - column: { name: cancelled_at, type: DATETIME }
              - column: { name: refund_amount, type: BIGINT }
              - column: { name: cancel_reason, type: VARCHAR(255) }
