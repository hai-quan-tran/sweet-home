databaseChangeLog:
  - changeSet:
      id: 008-order-stay
      author: sweet-home
      changes:
        - createTable:
            tableName: order_stay
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: order_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: room_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: start_at, type: DATETIME, constraints: { nullable: false } }
              - column: { name: end_at, type: DATETIME, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: order_stay
            baseColumnNames: order_id
            constraintName: fk_order_stay_order
            referencedTableName: rental_order
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: order_stay
            baseColumnNames: room_id
            constraintName: fk_order_stay_room
            referencedTableName: room
            referencedColumnNames: id
        - createIndex:
            tableName: order_stay
            indexName: idx_order_stay_room_time
            columns:
              - column: { name: room_id }
              - column: { name: start_at }
        # Đơn đã có trước GĐ6: mỗi đơn đúng 1 chặng = phòng + giờ nhận/trả của đơn
        - sql:
            sql: >
              INSERT INTO order_stay (order_id, room_id, start_at, end_at)
              SELECT id, room_id, check_in_at, check_out_at FROM rental_order
