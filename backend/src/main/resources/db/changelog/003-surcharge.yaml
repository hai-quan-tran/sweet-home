databaseChangeLog:
  - changeSet:
      id: 003-surcharge
      author: sweet-home
      changes:
        - createTable:
            tableName: surcharge
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: when_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: amount, type: BIGINT }
              - column: { name: grace_minutes, type: INT }
              - column: { name: active, type: BIT, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME(3), constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(50) }
              - column: { name: updated_at, type: DATETIME(3) }
              - column: { name: updated_by, type: VARCHAR(50) }
  - changeSet:
      id: 003-surcharge-weekday
      author: sweet-home
      changes:
        - createTable:
            tableName: surcharge_weekday
            columns:
              - column: { name: surcharge_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: weekday, type: VARCHAR(10), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: surcharge_weekday
            baseColumnNames: surcharge_id
            constraintName: fk_surcharge_weekday_surcharge
            referencedTableName: surcharge
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: 003-surcharge-date-range
      author: sweet-home
      changes:
        - createTable:
            tableName: surcharge_date_range
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: surcharge_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: from_date, type: DATE, constraints: { nullable: false } }
              - column: { name: to_date, type: DATE, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: surcharge_date_range
            baseColumnNames: surcharge_id
            constraintName: fk_surcharge_date_range_surcharge
            referencedTableName: surcharge
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: 003-surcharge-room-type
      author: sweet-home
      changes:
        - createTable:
            tableName: surcharge_room_type
            columns:
              - column: { name: surcharge_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: room_type_id, type: BIGINT, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: surcharge_room_type
            columnNames: surcharge_id, room_type_id
            constraintName: pk_surcharge_room_type
        - addForeignKeyConstraint:
            baseTableName: surcharge_room_type
            baseColumnNames: surcharge_id
            constraintName: fk_surcharge_room_type_surcharge
            referencedTableName: surcharge
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: surcharge_room_type
            baseColumnNames: room_type_id
            constraintName: fk_surcharge_room_type_room_type
            referencedTableName: room_type
            referencedColumnNames: id
