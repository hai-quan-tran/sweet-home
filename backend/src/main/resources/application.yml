# Cấu hình chung cho mọi môi trường. Thông tin kết nối nằm ở application-{dev,stage,prod}.yml
spring:
  application:
    name: sweet-home
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-stacktrace: never
    include-message: never

# Đăng nhập: JWT trong cookie HttpOnly. Khoá ký và mật khẩu cookie theo profile (xem application-{dev,stage,prod}.yml)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 7
    refresh-token-remember-days: 30
  cookie:
    secure: true
